<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>G-STAR 2026 Meet List</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky three-tab bar, country rail under it, card grid; the meet tab is an ordered worklist */
:root{
  --bg:#edf0f3; --surface:#ffffff; --sunk:#f5f7f9; --ink:#17212b; --muted:#5b6876; --line:#d6dce2;
  --t1:#2f4b8f; --t1-soft:#e6ecf7; --t2:#a8570c; --t2-soft:#fbefe1; --t3:#0e7356; --t3-soft:#e2f3ec;
  --miss:#94a0ab; --focus:#2f6fd6; --t4:#6b3fa0; --t5:#b5408a;
  --display:"Space Grotesk","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --sunk:#151b21; --ink:#e4e9ee; --muted:#9aa7b4; --line:#2c3640;
  --t1:#8eaaf0; --t1-soft:#1d2840; --t2:#f0a64f; --t2-soft:#33251456; --t3:#4fd1a5; --t3-soft:#13302659;
  --miss:#6c7884; --focus:#7aa8ff; --t4:#c4a3f0; --t5:#f29ccd; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --sunk:#151b21; --ink:#e4e9ee; --muted:#9aa7b4; --line:#2c3640;
  --t1:#8eaaf0; --t1-soft:#1d2840; --t2:#f0a64f; --t2-soft:#33251456; --t3:#4fd1a5; --t3-soft:#13302659;
  --miss:#6c7884; --focus:#7aa8ff; --t4:#c4a3f0; --t5:#f29ccd; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto}
header.top{padding-block:28px 14px;display:grid;gap:6px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-size:clamp(24px,4vw,34px);margin:0;line-height:1.2;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:70ch;font-size:14px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--miss)}
.sync.ok .dot{background:var(--t3)} .sync.local .dot{background:var(--t2)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;border-bottom:2px solid var(--line);padding-top:8px;overflow-x:auto}
.tab{flex:0 0 auto;font:inherit;cursor:pointer;border:2px solid transparent;border-bottom:none;border-radius:10px 10px 0 0;background:transparent;color:var(--muted);padding:8px 14px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;margin-bottom:-2px;text-align:left}
.tab small{font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.tab span{font-weight:600;font-size:15px}
.tab b{font-family:var(--mono);font-size:12px;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--line);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);border-color:var(--line)}
.tab[data-t="interest"][aria-selected="true"]{color:var(--t1);border-top-color:var(--t1)}
.tab[data-t="regional"][aria-selected="true"]{color:var(--t2);border-top-color:var(--t2)}
.tab[data-t="meet"][aria-selected="true"]{color:var(--t3);border-top-color:var(--t3)}
.tab[data-t="art"][aria-selected="true"]{color:var(--t4);border-top-color:var(--t4)}
.tab[data-t="art"][aria-selected="true"] b{background:var(--t4)}
.tab[aria-selected="true"] b{color:#fff}
.tab[data-t="interest"][aria-selected="true"] b{background:var(--t1)}
.tab[data-t="regional"][aria-selected="true"] b{background:var(--t2)}
.tab[data-t="meet"][aria-selected="true"] b{background:var(--t3)}
:root[data-theme="dark"] .tab[aria-selected="true"] b{color:#11161b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-selected="true"] b{color:#11161b}}
.panel{padding-top:14px;display:grid;gap:12px}
.intro{margin:0;font-size:14px;padding:10px 14px;border-radius:8px;background:var(--sunk);border-left:4px solid var(--accent)}
.countries{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.cty{flex:0 0 auto;font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;display:flex;gap:6px;align-items:center}
.cty em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted)}
.cty[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.cty[aria-selected="true"] em{color:inherit;opacity:.85}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.btn{font:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px}
.btn.primary{background:var(--t3);border-color:var(--t3);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.primary{color:#11161b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#11161b}}
.msg{font-size:13px;color:var(--t3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.picked{box-shadow:inset 0 0 0 2px var(--t3)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.name{font-family:var(--display);font-size:18px;margin:0;line-height:1.25}
.alt{font-size:13px;color:var(--muted)}
.flag{flex:0 0 auto;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--sunk);border:1px solid var(--line)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:1px 8px;border-radius:5px;background:var(--sunk);color:var(--muted)}
.region{font-size:13px;padding:6px 10px;border-radius:6px;background:var(--t2-soft)}
.note{font-size:13px;color:var(--t2);font-weight:600}
dl{margin:0;display:grid;gap:7px}
dt{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
dd{margin:0;font-size:14px;overflow-wrap:anywhere}
.miss{color:var(--miss);font-style:italic}
.foot{margin-top:auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:8px;border-top:1px dashed var(--line);font-size:13px}
a{color:var(--t1)}
.pick{font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:2px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:999px;padding:4px 12px;display:inline-flex;gap:6px;align-items:center}
.pick .box{width:16px;height:16px;border:2px solid currentColor;border-radius:4px;display:inline-grid;place-items:center;font-size:11px;line-height:1}
.pick[aria-pressed="true"]{background:var(--t3);border-color:var(--t3);color:#fff}
:root[data-theme="dark"] .pick[aria-pressed="true"]{color:#11161b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pick[aria-pressed="true"]{color:#11161b}}
.pick[aria-pressed="true"] .box::after{content:"✓"}
.pick:disabled{opacity:.55;cursor:not-allowed}
.purpose-peek{font-size:13px;padding:6px 10px;border-radius:6px;background:var(--t3-soft)}
/* meet list */
.mlist{display:grid;gap:12px}
.mrow{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--t3);border-radius:10px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:12px;min-width:0}
.num{font-family:var(--mono);font-size:15px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--t3);color:#fff}
:root[data-theme="dark"] .num{color:#11161b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .num{color:#11161b}}
.mbody{display:grid;gap:8px;min-width:0}
.mtop{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.mctl{display:flex;gap:4px}
.mctl .btn{padding:4px 9px}
label.plab{font-size:13px;font-weight:600;color:var(--t3)}
textarea{font:inherit;font-size:14px;width:100%;min-height:72px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sunk);color:var(--ink)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.preset{font:inherit;font-size:12px;cursor:pointer;border:1px dashed var(--t3);background:transparent;color:var(--t3);border-radius:999px;padding:2px 10px}
.saved{font-size:12px;color:var(--muted)}
details summary{cursor:pointer;font-size:13px;color:var(--muted)}
details dl{margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:36px 16px;border:2px dashed var(--line);border-radius:12px}
/* country colors: each element carries --cc (solid); tint derives from it in both themes */
[style*="--cc"]{--ct:color-mix(in srgb,var(--cc) 13%,var(--surface))}
.cty{border:2px solid var(--cc,var(--line));background:var(--ct,var(--surface));font-weight:600;min-height:40px}
.cty .cdot{width:11px;height:11px;border-radius:50%;background:var(--cc)}
.cty[aria-selected="true"]{background:var(--cc,var(--ink));border-color:var(--cc,var(--ink));color:#fff}
.cty.all{--cc:var(--ink)}
:root[data-theme="dark"] .cty.all[aria-selected="true"]{color:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cty.all[aria-selected="true"]{color:var(--bg)}}
.card{border-top:6px solid var(--cc)}
.card .flag{background:var(--cc);border-color:var(--cc);color:#fff}
.card .region{background:var(--ct)}
.card.picked{box-shadow:0 0 0 2px var(--cc)}
.card .pick[aria-pressed="true"],.mrow .pick[aria-pressed="true"]{background:var(--cc);border-color:var(--cc);color:#fff}
.cgroup{display:grid;gap:12px}
.cband{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:9px 16px;border-radius:10px;background:var(--cc);color:#fff}
.cband b{font-family:var(--display);font-size:21px}
.cband span{font-size:14px;opacity:.92}
.legend{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.legend .sw{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px}
.legend i{display:inline-block;width:18px;height:18px;border-radius:5px;background:var(--cc);vertical-align:-4px;margin-right:6px}
.msum{display:flex;gap:10px;flex-wrap:wrap}
.msum div{display:flex;flex-direction:column;padding:8px 16px;border-radius:10px;background:var(--cc);color:#fff;min-width:110px}
.msum b{font-family:var(--display);font-size:24px;line-height:1.2}
.msum span{font-size:13px}
.mgroup{border:2px solid var(--cc);border-radius:12px;overflow:hidden;background:var(--ct)}
.mgroup .cband{border-radius:0}
.mgroup .mlist{padding:12px}
.mrow{border-left:1px solid var(--line)}
.mrow .num{background:var(--cc);color:#fff}
.mrow textarea{background:var(--ct)}
.mrow label.plab{color:var(--ink)}
.seg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.seg .btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.dband{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:10px 16px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);border-left:6px solid var(--muted)}
.dband b{font-family:var(--display);font-size:20px}
.dband span{font-size:14px;color:var(--muted)}
.dband em,.ulog em{font-style:normal;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--focus);color:#fff}
.dgroup.latest .dband{border-left-color:var(--focus);background:color-mix(in srgb,var(--focus) 10%,var(--surface))}
.ulog{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;display:grid;gap:4px;font-size:14px}
.urow{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted)}
.urow.now{color:var(--ink);font-weight:600}
.udate{min-width:130px}
.tag.new{background:var(--focus);color:#fff;font-weight:700}
.tag.when{border:1px solid var(--line)}
.tab[data-t="fav"][aria-selected="true"]{color:var(--t5);border-top-color:var(--t5)}
.tab[data-t="fav"][aria-selected="true"] b{background:var(--t5)}
.fbtns{display:flex;gap:6px;flex-wrap:wrap}
.star{font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:2px solid var(--t5);background:transparent;color:var(--t5);border-radius:999px;padding:4px 12px}
.star[aria-pressed="true"]{background:var(--t5);color:#fff}
:root[data-theme="dark"] .star[aria-pressed="true"]{color:#11161b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .star[aria-pressed="true"]{color:#11161b}}
.star:disabled{opacity:.55;cursor:not-allowed}
.tag.src{background:var(--t5);color:#fff;font-weight:600}
.objbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.obtn{--o:var(--oc);font:inherit;cursor:pointer;text-align:left;border:2px solid var(--o);border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--o) 10%,var(--surface));color:var(--ink);display:grid;gap:2px;align-content:start}
.obtn span{font-weight:700;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.obtn em{font-style:normal;font-family:var(--mono);font-size:13px;padding:0 8px;border-radius:999px;background:var(--o);color:#fff}
.obtn small{font-size:12px;color:var(--muted);line-height:1.35}
.obtn[aria-selected="true"]{background:var(--o);color:#fff}
.obtn[aria-selected="true"] small{color:inherit;opacity:.9}
.obtn[aria-selected="true"] em{background:var(--surface);color:var(--o)}
.ogroup{--o:var(--oc);border:2px solid var(--o);border-radius:12px;overflow:hidden;background:color-mix(in srgb,var(--o) 7%,var(--surface))}
.oband{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--o);color:#fff}
.oband b{font-family:var(--display);font-size:21px}
.oband span{font-size:14px;opacity:.92}
.ogroup .mlist{padding:12px}
.ochips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ochip{--o:var(--oc);font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:2px solid var(--o);background:transparent;color:var(--o);border-radius:999px;padding:2px 10px}
.ochip[aria-pressed="true"]{background:var(--o);color:#fff}
span.ochip{cursor:default}
.cchip{display:inline-block;font-size:12px;font-weight:600;padding:0 8px;border-radius:5px;background:var(--cc);color:#fff}
.hint{margin:0;font-size:13px;color:var(--muted)}
:root[data-theme="dark"] .obtn,:root[data-theme="dark"] .ogroup,:root[data-theme="dark"] .ochip{--o:var(--ocd)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .obtn,:root:not([data-theme="light"]) .ogroup,:root:not([data-theme="light"]) .ochip{--o:var(--ocd)}}
:root[data-theme="dark"] .obtn[aria-selected="true"],:root[data-theme="dark"] .oband,:root[data-theme="dark"] .ochip[aria-pressed="true"]{color:#11161b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .obtn[aria-selected="true"],:root:not([data-theme="light"]) .oband,:root:not([data-theme="light"]) .ochip[aria-pressed="true"]{color:#11161b}}
.roster{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;gap:8px}
.rhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.rhead b{font-family:var(--display);font-size:18px}
.rhead span{font-size:13px;color:var(--muted)}
.rlist{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rp{display:flex;align-items:center;gap:4px;border:2px solid var(--t3);border-radius:999px;padding:3px 6px 3px 12px;background:var(--t3-soft)}
.rp b{font-size:15px}
.rp em{font-style:normal;font-size:12px;font-family:var(--mono);color:var(--muted);padding:0 6px}
.rname{font:inherit;font-weight:600;width:7.5em;border:none;border-bottom:1px dashed var(--muted);background:transparent;color:var(--ink);padding:2px 0}
.rx{font:inherit;cursor:pointer;border:none;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:0 4px}
.wline{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.wchip{font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:2px solid var(--t3);background:transparent;color:var(--t3);border-radius:999px;padding:2px 10px}
.wchip[aria-pressed="true"]{background:var(--t3);color:#fff}
span.wchip{cursor:default}
:root[data-theme="dark"] .wchip[aria-pressed="true"]{color:#11161b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wchip[aria-pressed="true"]{color:#11161b}}
.slot{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.slotin{font:inherit;font-size:14px;min-width:0;width:16em;max-width:100%;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--sunk);color:var(--ink)}
.mview{margin-top:2px}
.mview .btn{font-size:15px;padding:8px 14px}
.mview .btn[aria-pressed="true"]{background:var(--t3);border-color:var(--t3);color:#fff;font-weight:700}
.rgrp{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:1px 4px}
.rgroups{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
.rgchip{padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--sunk)}
.gtabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gtab{font:inherit;cursor:pointer;text-align:left;border:2px solid var(--gc);border-radius:12px;padding:10px 14px;background:color-mix(in srgb,var(--gc) 9%,var(--surface));color:var(--ink);display:grid;gap:0}
.gtab.g1{--gc:#0e7356} .gtab.g2{--gc:#a8570c} .gtab.g5{--gc:#9a6a00}
.gtab small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.gtab span{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.25}
.gtab em{font-style:normal;font-size:13px;color:var(--muted)}
.gtab[aria-selected="true"]{background:var(--gc);color:#fff}
.gtab[aria-selected="true"] small,.gtab[aria-selected="true"] em{color:inherit;opacity:.9}
.sstats{display:flex;gap:8px;flex-wrap:wrap}
.sstats div{display:flex;flex-direction:column;align-items:center;min-width:104px;padding:6px 14px;border-radius:12px;color:#fff;background:var(--sc)}
.sstats span{font-size:12px;font-weight:600}
.sstats b{font-size:18px}
.st-invite{--sc:#e8793a} .st-pending{--sc:#2f9bd8} .st-confirmed{--sc:#22a447} .st-block{--sc:#c9ced4}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.sgrid{border-collapse:collapse;width:100%;min-width:640px;table-layout:fixed}
.sgrid th,.sgrid td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:5px;vertical-align:top;text-align:left}
.sgrid thead th{font-size:13px;font-weight:700;padding:8px;background:var(--sunk);position:sticky;top:0}
.sgrid thead th small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.sgrid .tcol{width:58px;font-family:var(--mono);font-size:12px;color:var(--muted);border-left:none;background:var(--sunk)}
.sgrid td{height:64px}

function makeSheetDb(){

  const subs = [], pend = [];
  const applyOp = (d, op) => { const c = d[op.c] = d[op.c] || {}; if (op.op === "delete") delete c[op.id]; else c[op.id] = op.data; };
  const view = () => { const d = JSON.parse(JSON.stringify(data)); pend.forEach(op => applyOp(d, op)); return d; };
  const notify = () => { const d = view(); subs.forEach(f => f(d)); };
  const take = (j, force) => { const js = JSON.stringify(j.data || {}); if (!force && js === lastJson) return false; lastJson = js; data = Object.assign({meet:{}, sched:{}, settings:{}}, j.data || {}); return true; };

  let q = Promise.resolve();
  function post(op){
    pend.push(op); notify();
    const p = q.then(async () => {
      try {
        const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({pin: PIN, ops:[op]})});
        const j = await r.json();

    });
    q = p.catch(() => {}); return p;
  }
  const colSnap = (d, c) => ({docs: Object.entries(d[c] || {}).map(([id, v]) => ({id, data: () => v})), metadata: {fromCache: false}});
  const docApi = (c, id) => ({
    set: v => post({op:"set", c, id, data: JSON.parse(JSON.stringify(v))}),
    delete: () => post({op:"delete", c, id}),
    onSnapshot(fn){ subs.push(d => { const v = (d[c] || {})[id]; fn({exists: !!v, data: () => v}); }); if (started) fn({exists: !!view()[c][id], data: () => view()[c][id]}); return () => {}; }
  });
  return {
    collection: c => ({ doc: id => docApi(c, id), onSnapshot(fn){ subs.push(d => fn(colSnap(d, c))); return () => {}; } }),
    async start(){ await pull(); started = true; if (STATIC) return; setInterval(() => { if (!document.hidden) pull().then(() => { try { syncNames(); } catch(e){} }).catch(() => setSync("local", "การเชื่อมต่อขาดชั่วคราว กำลังลองใหม่…")); }, 8000); document.addEventListener("visibilitychange", () => { if (!document.hidden) pull().catch(() => {}); }); },
    async check(pin){ const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({pin, ops:[]})}); const j = await r.json(); return !!j.ok; },
    async call(action, extra){ const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(Object.assign({pin: PIN, action}, extra || {}))}); const j = await r.json(); if (!j.ok && j.error === "bad_pin") badPin(); return j; },
    get: () => view(),
    setDoc: (c, id, v) => post({op:"set", c, id, data: v})
  };
}
// company names for the email (the backend has no company list): kept in settings/cnames
function syncNames(){
  if (!canWrite || STATIC || !sheetDb) return;
  const map = {}; sched.forEach(e => { const x = e.cid && byId[e.cid]; if (x) map[e.cid] = [x.n, x.c || "", (EN_DATA[x.c] || x.c || "")]; });
  const cur = (sheetDb.get().settings.cnames || {}).map || {};
  if (JSON.stringify(map) !== JSON.stringify(Object.fromEntries(Object.keys(map).map(k => [k, cur[k]])))) sheetDb.setDoc("settings", "cnames", {map, updatedAt: new Date().toISOString()}).catch(() => {});
}
// ---- email summary panel ----
let MAIL = null;
const KLANGS = [["th","ไทย","Thai"],["ko","เกาหลี","Korean"],["zh","จีน","Chinese"]];
const normRec = r => Object.assign({}, r, {keep: Array.isArray(r.keep) ? r.keep.slice() : (r.lang === "en" ? [] : ["th"])});
const MDAYS = [["19","พฤหัส 19 พ.ย."],["20","ศุกร์ 20 พ.ย."],["21","เสาร์ 21 พ.ย."]];
function mailToday(){ const d = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10); return {"2026-11-19":"19","2026-11-20":"20","2026-11-21":"21"}[d] || "19"; }
async function openMail(){
  MAIL = {loading: true, list: [], day: mailToday(), msg: ""}; drawMail();
  try { const j = await sheetDb.call("mail_get"); if (!j.ok) throw new Error(j.error); if (!("recipients" in j)){ Object.assign(MAIL, {loading: false, old: true}); drawMail(); return; }
    Object.assign(MAIL, {loading: false, list: (j.recipients || []).map(normRec), auto: j.auto, hour: j.sendHour, last: j.lastSent}); }
  catch(e){ Object.assign(MAIL, {loading: false, err: true}); }
  drawMail();
}
function closeMail(){ MAIL = null; drawMail(); }
function drawMail(){
  let el = document.getElementById("mailwrap");
  if (!MAIL){ if (el) el.remove(); document.documentElement.classList.remove("modal-open"); return; }
  if (!el){ el = document.createElement("div"); el.id = "mailwrap"; document.body.appendChild(el); }
  const EN = lang === "en", ld = MAIL.last && MDAYS.find(d => d[0] === MAIL.last.day);
  const last = MAIL.last ? `${EN ? ({"19":"Thu 19 Nov","20":"Fri 20 Nov","21":"Sat 21 Nov"}[MAIL.last.day] || MAIL.last.day) : (ld ? ld[1] : MAIL.last.day)} · ${new Date(MAIL.last.at).toLocaleString(EN ? "en-GB" : "th-TH", {timeZone: "Asia/Seoul", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"})} (${MAIL.last.how === "auto" ? (EN ? "automatic" : "อัตโนมัติ") : (EN ? "sent manually" : "กดส่งเอง")})` : (EN ? "Not sent yet" : "ยังไม่เคยส่ง");
  el.innerHTML = `<div class="mback" data-mailclose="1"><section class="dmodal mailbox" role="dialog" aria-modal="true" aria-labelledby="mailh"><button class="mx" data-mailclose="1" aria-label="ปิด">×</button>
    <h3 class="dname" id="mailh">📧 อีเมลสรุปการประชุม</h3>
    ${MAIL.loading ? `<p class="mmut">กำลังโหลด…</p>` : MAIL.old ? `<div class="minfo">⚠️ สคริปต์ใน Google ยังเป็นเวอร์ชันเก่า — ใน Apps Script ต้องกด Deploy → Manage deployments → ✏️ → New version → Deploy ก่อน</div>` : MAIL.err ? `<p class="mmut">โหลดไม่ได้ — ระบบอีเมลอาจยังไม่ได้อัปเดตใน Apps Script</p>` : `
    <div class="minfo">${MAIL.auto ? `✅ ส่งอัตโนมัติทุกวัน ประมาณ ${MAIL.hour}:00 (เวลาเกาหลี) วันที่ 19–21 พ.ย.` : `⚠️ ยังไม่ได้เปิดส่งอัตโนมัติ — ผู้ดูแลต้องกด Run setupDailyEmail ใน Apps Script หนึ่งครั้ง`}<br><span class="mmut" data-notr="1">${lang === "en" ? "Last sent" : "ส่งล่าสุด"}: ${last}</span></div>
    <div class="mlab">ผู้รับ</div>
    <div class="mrows">${MAIL.list.map((r, i) => `<div class="mrow1"><input data-mf="name" data-i="${i}" value="${esc(r.name || "")}" placeholder="ชื่อ" maxlength="40"><input data-mf="email" data-i="${i}" type="email" value="${esc(r.email || "")}" placeholder="name@example.com" maxlength="120"><select data-mf="lang" data-i="${i}"><option value="th" ${r.lang !== "en" ? "selected" : ""}>ไทย</option><option value="en" ${r.lang === "en" ? "selected" : ""}>English</option></select><button class="btn mdel" data-mdel="${i}" aria-label="ลบ">×</button><div class="mkeep"><span>ไม่ต้องแปล (คงภาษาเดิม):</span>${KLANGS.map(k => `<label><input type="checkbox" data-mkeep="${k[0]}" data-i="${i}" ${(r.keep || []).includes(k[0]) ? "checked" : ""}> <span data-notr="1">${lang === "en" ? k[2] : k[1]}</span></label>`).join("")}</div></div>`).join("") || `<p class="mmut">ยังไม่มีผู้รับ</p>`}</div>
    <div class="mbtns"><button class="btn" data-madd="1">＋ เพิ่มผู้รับ</button><button class="btn primary" data-msaveall="1">บันทึกรายชื่อ</button></div>
    <p class="mmut">ไทย / English = ภาษาของหัวข้อในอีเมล · ภาษาที่ติ๊ก "ไม่ต้องแปล" จะคงไว้ตามที่จด ภาษาอื่นแปลเป็นอังกฤษด้วย Google Translate (มีข้อความต้นฉบับแนบท้าย)</p>
    <div class="mlab">ส่งทันที</div>
    <div class="mbtns"><select data-mday2="1">${MDAYS.map(d => `<option value="${d[0]}" ${MAIL.day === d[0] ? "selected" : ""}>${d[1]}</option>`).join("")}</select><button class="btn primary" data-msend="1">📤 ส่งสรุปวันนี้ทันที</button></div>`}
    ${MAIL.msg ? `<div class="mmsg">${esc(MAIL.msg)}</div>` : ""}
  </section></div>`;
  document.documentElement.classList.add("modal-open");
  try { translateDom(el); } catch(e){}
}
document.addEventListener("input", e => { if (!MAIL || !e.target.dataset || !e.target.dataset.mf) return; MAIL.list[+e.target.dataset.i][e.target.dataset.mf] = e.target.value; });
document.addEventListener("change", e => { if (!MAIL || !e.target.dataset) return; if (e.target.dataset.mf) MAIL.list[+e.target.dataset.i][e.target.dataset.mf] = e.target.value; if (e.target.dataset.mkeep){ const r = MAIL.list[+e.target.dataset.i], k = e.target.dataset.mkeep; r.keep = KLANGS.map(x => x[0]).filter(x => x === k ? e.target.checked : (r.keep || []).includes(x)); } if (e.target.dataset.mday2) MAIL.day = e.target.value; });
document.addEventListener("keydown", e => { if (e.key === "Escape" && MAIL) closeMail(); });
document.addEventListener("click", async e => {
  const t = e.target;
  if (t.closest && t.closest("#mailbtn")){ if (canWrite && sheetDb) openMail(); return; }
  if (!MAIL || !t.dataset) return;
  if (t.dataset.mailclose){ closeMail(); return; }
  if (t.dataset.madd){ MAIL.list.push({name: "", email: "", lang: "th", keep: ["th"]}); MAIL.msg = ""; drawMail(); const ins = document.querySelectorAll('#mailwrap [data-mf="name"]'); if (ins.length) ins[ins.length - 1].focus(); return; }
  if (t.dataset.mdel){ MAIL.list.splice(+t.dataset.mdel, 1); MAIL.msg = "ลบแล้ว — กด บันทึกรายชื่อ เพื่อยืนยัน"; drawMail(); return; }
  if (t.dataset.msaveall){
    const bad = MAIL.list.filter(r => (r.email || "").trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email.trim()));
    if (bad.length){ MAIL.msg = "อีเมลไม่ถูกต้อง: " + bad.map(r => r.email).join(", "); drawMail(); return; }
    MAIL.msg = "กำลังบันทึก…"; drawMail();
    try { const j = await sheetDb.call("mail_set", {recipients: MAIL.list.filter(r => (r.email || "").trim())}); if (!j.ok) throw new Error(j.error); MAIL.list = j.recipients.map(normRec); MAIL.msg = `บันทึกแล้ว · ผู้รับ ${MAIL.list.length} คน`; }
    catch(er){ MAIL.msg = "บันทึกไม่สำเร็จ ลองอีกครั้ง"; }
    drawMail(); return;
  }
  if (t.dataset.msend){
    if (t.dataset.armed !== "1"){ t.dataset.armed = "1"; t.textContent = L("กดอีกครั้งเพื่อส่งอีเมลจริง"); t.classList.add("armed"); return; }
    MAIL.msg = "กำลังแปลและส่งอีเมล… (อาจใช้เวลาสักครู่)"; drawMail();
    syncNames();
    try { const j = await sheetDb.call("mail_send", {day: MAIL.day}); if (!j.ok) throw new Error(j.error);
      MAIL.last = {day: j.day, at: j.at, how: j.how}; const s = j.sent || {};
      MAIL.msg = `ส่งแล้ว ✓ ฉบับไทย ${s.th || 0} คน · ฉบับอังกฤษ ${s.en || 0} คน`; }
    catch(er){ MAIL.msg = String(er.message) === "no_recipients" ? "ยังไม่มีผู้รับ — เพิ่มอีเมลแล้วกด บันทึกรายชื่อ ก่อน" : "ส่งไม่สำเร็จ: " + er.message; }
    drawMail(); return;
  }
});
let sheetDb = null;
function updPin(){ const mb = document.getElementById("mailbtn"); if (mb) mb.hidden = STATIC || !canWrite; const b = document.getElementById("pinbtn"); if (!b) return; if (STATIC){ b.style.display = "none"; return; } b.textContent = canWrite ? L("✓ แก้ไขได้ · ออกจากโหมดแก้ไข") : L("🔑 ใส่รหัสทีมเพื่อแก้ไข"); b.classList.toggle("on", canWrite); }
function badPin(){ PIN = ""; try { localStorage.removeItem("gstar_pin"); } catch(e){} canWrite = false; render(); setSync("local", "รหัสทีมไม่ถูกต้องหรือถูกเปลี่ยน — กด 🔑 ใส่รหัสทีมใหม่"); }
async function checkPin(pin, quiet){
  try {
    const ok = await sheetDb.check(pin);
    if (ok){ PIN = pin; try { localStorage.setItem("gstar_pin", pin); } catch(e){} canWrite = true; render(); setSync("ok", "เชื่อมข้อมูลทีมแล้ว — แก้ไขได้ ทุกคนเห็นข้อมูลชุดเดียวกัน"); setTimeout(syncNames, 1500); }
    else { badPin(); if (!quiet) alert(L("รหัสทีมไม่ถูกต้อง")); }
  } catch(e){ if (!quiet) alert(L("เชื่อมต่อไม่ได้ ลองอีกครั้ง")); }
}
document.addEventListener("click", e => {
  if (!e.target.closest || !e.target.closest("#pinbtn")) return;
  if (canWrite){ PIN = ""; try { localStorage.removeItem("gstar_pin"); } catch(er){} canWrite = false; view.edit = null; render(); setSync("ok", "ออกจากโหมดแก้ไขแล้ว — ดูได้อย่างเดียว"); return; }
  const p = (prompt(L("ใส่รหัสทีม (ขอได้จากผู้จัดทำ)")) || "").trim(); if (p && sheetDb) checkPin(p, false);
});

function useSnap(why){ meet = JSON.parse(JSON.stringify(SNAP.meet || {})); mode = "snap"; canWrite = false; setSync("local", why + " — แสดงรายชื่อที่ทีมเลือกไว้ (อัปเดต " + SNAP.at + ") แบบดูอย่างเดียว"); render(); }
meet = JSON.parse(JSON.stringify(SNAP.meet || {})); render(); setSync("", "กำลังเชื่อมต่อข้อมูลทีม…");
(async () => {
  let db = null, user = null;
  db = sheetDb = makeSheetDb();
  canWrite = false;
  store = db.collection("meet");
  try {
    schedRef = db.collection("sched");
    schedRef.onSnapshot(snap => { const next = []; snap.docs.forEach(d => { const v = d.data(); if (v && v.day && v.time) next.push({id: d.id, kind: v.kind === "block" ? "block" : "meet", grp: String(v.grp || "g1"), day: String(v.day), time: String(v.time), cid: String(v.cid || ""), name: String(v.name || ""), contact: String(v.contact || ""), status: STATUS[v.status] ? v.status : "pending", loc: String(v.loc || ""), topic: String(v.topic || ""), note: String(v.note || "").slice(0, 80), mins: String(v.mins || ""), minsBy: String(v.minsBy || ""), minsAt: String(v.minsAt || ""), who: Array.isArray(v.who) ? v.who.map(String) : []}); }); sched = next; render(); }, () => {});
    peopleRef = db.collection("settings").doc("people");
    peopleRef.onSnapshot(snap => { const v = snap.exists ? snap.data() : null; if (v && Array.isArray(v.list)) { people = v.list.filter(p => p && p.id && p.name).map(p => ({id: String(p.id), name: String(p.name), grp: GRP[p.grp] ? p.grp : "g1"})); render(); } }, () => {});
  } catch(e){}
  let loaded = false;
  const timer = setTimeout(() => { if (!loaded) useSnap("ยังเชื่อมต่อข้อมูลทีมไม่ได้"); }, 10000);
  store.onSnapshot(snap => {
    const next = {}; snap.docs.forEach(d => { const v = d.data(); if (v) next[d.id] = {picked:!!v.picked, order:Number(v.order)||0, purpose:String(v.purpose||""), star:!!v.star}; if (Array.isArray(v.obj)) next[d.id].obj = v.obj.filter(k => OBJ_BY[k]); if (Array.isArray(v.who)) next[d.id].who = v.who.map(String); if (v.slot) next[d.id].slot = String(v.slot); if (v.cnote){ next[d.id].cnote = String(v.cnote).slice(0, 200); next[d.id].cnoteBy = String(v.cnoteBy || ""); next[d.id].cnoteAt = String(v.cnoteAt || ""); } });
    meet = next; mode = "team";
    if (!snap.metadata.fromCache){ loaded = true; clearTimeout(timer); }
    setSync("ok", canWrite ? "เชื่อมข้อมูลทีมแล้ว — แก้ไขได้ ทุกคนเห็นข้อมูลชุดเดียวกัน" : "เชื่อมข้อมูลทีมแล้ว — ดูได้อย่างเดียว — ถ้าต้องการแก้ไข กดปุ่ม 🔑 ใส่รหัสทีม");
    render();
  }, err => { clearTimeout(timer); useSnap("เชื่อมข้อมูลทีมไม่ได้"); });
  db.start().then(() => { if (STATIC){ setSync("ok", "ข้อมูลทีมล่าสุด — ตอนนี้ดูได้อย่างเดียว (ระบบแก้ไขออนไลน์กำลังจะเปิด)"); return; } if (PIN) checkPin(PIN, true); }).catch(() => { clearTimeout(timer); useSnap("เชื่อมข้อมูลทีมไม่ได้"); });
})();
</script>
